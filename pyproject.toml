[project]
name = "panna-crm-backend"
version = "1.0.0"
description = "Panna Biryani CRM API"
requires-python = ">=3.11"
dependencies = [
  "tzdata>=2024.1",
  "python-multipart (>=0.0.32,<0.0.33)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]
exclude = [".venv", "alembic/versions", "scratch", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is intentional
    "B904",   # exception chaining — gradual adoption
    "E712",   # SQLAlchemy boolean column comparisons (`== True`) are intentional
    "UP042",  # `class X(str, Enum)` is intentional for FastAPI/Pydantic enums
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
